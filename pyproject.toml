[project]
name = "sps-genai"
version = "0.1.0"
description = "Applied Generative AI: bigram text generation and spaCy word embedding API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-lg",
    "fastapi[standard]>=0.142.0",
    "spacy>=3.8,<3.9",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
